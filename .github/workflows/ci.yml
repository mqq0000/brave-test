# ============================================================
# 勇者测试 CI 流水线
# 后端：Maven 编译 + 单元测试（JDK17）
# 前端：npm 安装 + Vite 构建（Node 20）
# ============================================================
name: brave-test-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: 后端 编译+单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brave-test-backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译并执行单元测试
        run: mvn -B -ntp test

      - name: 打包
        run: mvn -B -ntp -DskipTests package

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: brave-test-backend/target/*.jar
          retention-days: 7

  frontend:
    name: 前端 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brave-test-frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: brave-test-frontend/package-lock.json

      - name: 安装依赖
        run: npm install --no-fund --no-audit

      - name: Vite 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: brave-test-frontend/dist
          retention-days: 7

  # 可选：推送镜像到镜像仓库（需在 GitHub Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后取消注释）
