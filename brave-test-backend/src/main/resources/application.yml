server:
  port: 8080

spring:
  application:
    name: brave-test-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/brave_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（生产环境务必改为环境变量注入）
jwt:
  secret: brave-test-jwt-secret-key-change-me-please-256bit!!
  expire-hours: 72

# MinIO 配置（背景图/称号/卡牌/信息集内容）
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: brave-test

# 净化剂规则（每月限产、定价）
game:
  purifier:
    monthly-limit: 100
    unit-price: 50000
    purify-value: 50
  level-up:
    tasks-per-level: 100
    reward: 10000
  commission-rate: 0.10
  ban-days: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn
